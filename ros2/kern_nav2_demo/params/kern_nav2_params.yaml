# Nav2 (Jazzy) configuration for the Kern Phase 6 demonstration.
#
# Only deviations from Nav2's own defaults are listed; every other parameter
# keeps its built-in value.
#
# THE LINE THAT MATTERS FOR KERN
#
#   controller_server.speed_limit_topic: /speed_limit
#
# The Kern adapter publishes nav2_msgs/msg/SpeedLimit on that topic with
# percentage: false before every goal, and clears it with 0.0 once no goal can
# still be running under it. controller_server passes the value to the
# controller plugin's setSpeedLimit. That is a *commanded* bound at the
# controller. It is not a guarantee about wheel speed, and Kern never describes
# it as one.

amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    max_particles: 2000
    min_particles: 500
    set_initial_pose: true
    initial_pose:
      x: -8.0
      y: 0.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: "kern_corridor.yaml"

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    odom_topic: /odom
    # Kern's per-operation speed bound arrives here.
    speed_limit_topic: /speed_limit
    controller_plugins: ["FollowPath"]
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      # A robot held to 0.15 m/s by an authority bound needs longer to make the
      # same progress. The stock 15 s aborts legitimate slow navigation, which
      # would be Kern's speed bound causing a failure it did not cause.
      movement_time_allowance: 45.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.5
      stateful: true
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # The vehicle ceiling. A Kern operation may be authorized for less, never
      # for more: the lease bound is applied on top of this through
      # setSpeedLimit.
      desired_linear_vel: 0.4
      max_angular_accel: 2.0
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.26
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 1.0
          raytrace_max_range: 10.0
          obstacle_max_range: 8.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      robot_radius: 0.26
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 2.5

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.4
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    # NavigateThroughPoses is deliberately not exercised in this phase.
    bt_loop_duration: 10
    default_server_timeout: 20

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    # At or above the controller ceiling: the smoother must not become a second,
    # invisible place where a speed bound lives.
    max_velocity: [0.4, 0.0, 2.0]
    min_velocity: [-0.4, 0.0, -2.0]
    odom_topic: /odom

collision_monitor:
  ros__parameters:
    use_sim_time: true
    # Nav2 Jazzy's bringup starts this node and its lifecycle manager aborts the
    # whole stack if it cannot configure, so it needs real configuration even in
    # a minimal deviation file. The default base frame is base_footprint, which
    # this robot does not have.
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.05
      max_height: 1.0
      enabled: true

docking_server:
  ros__parameters:
    use_sim_time: true
    # Nav2 Jazzy's bringup hard-codes this node into the navigation lifecycle
    # list, and a lifecycle manager that cannot configure one node aborts the
    # whole stack. Nothing in this demonstration docks; these are the stock
    # values, present so bringup completes.
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: false
      use_battery_status: false
      use_stall_detection: false

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - map_server
      - amcl
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
      - velocity_smoother
