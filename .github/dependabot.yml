version: 2
updates:
  # Cargo dependencies for the core workspace.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # The nav2-bridge is a separate workspace with its own Cargo.lock.
  - package-ecosystem: "cargo"
    directory: "/adapters/nav2-bridge"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - nav2-bridge

  # GitHub Actions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - dependencies
      - github-actions