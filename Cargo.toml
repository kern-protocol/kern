[workspace]
resolver = "2"
members = [
    "crates/kern-core",
    "crates/kern-policy",
    "crates/kern-authority",
    "crates/kern-enforcer",
    "crates/kern-execution",
    "crates/kern-execution-nav2",
    "crates/kern-ai",
]

# Both adapters need something the workspace gates must never need. The ROS 2
# bridge links against a sourced ROS installation through `r2r`, so it cannot
# build on a machine without ROS at all. The OpenAI-compatible model adapter
# pulls an HTTP and TLS stack that has no business in the authority build graph.
# Keeping both out means the workspace gates stay runnable everywhere, the
# trusted dependency set stays small, and no ordinary `cargo test` can reach a
# network or a credential. Each is built and gated from its own directory.
exclude = [
    "adapters/nav2-bridge",
    "adapters/openai-compatible",
]

[workspace.package]
edition = "2021"
rust-version = "1.81"
license = "Apache-2.0"

