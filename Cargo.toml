[workspace]
resolver = "2"
members = [
    "crates/kern-core",
    "crates/kern-policy",
    "crates/kern-authority",
    "crates/kern-enforcer",
    "crates/kern-execution",
    "crates/kern-execution-nav2",
    "crates/kern-ai",
]

# The ROS 2 bridge links against a sourced ROS installation through `r2r`, so it
# cannot build on a machine without ROS. Excluded so the workspace gates stay
# runnable everywhere; it is built from its own directory under ROS.
exclude = [
    "adapters/nav2-bridge",
]

[workspace.package]
edition = "2021"
rust-version = "1.81"
license = "Apache-2.0"

